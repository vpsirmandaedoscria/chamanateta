<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16082a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0521;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d95;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6ec7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonPink2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6ec7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff2d95;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bgGrad)"/>
  
  <!-- Outer ring glow -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#ff2d95" stroke-width="3" opacity="0.3" filter="url(#glowStrong)"/>
  
  <!-- Shield shape -->
  <path d="M256 80 L380 140 L380 280 Q380 360 256 420 Q132 360 132 280 L132 140 Z" 
        fill="none" stroke="url(#neonPink)" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <path d="M256 95 L370 150 L370 275 Q370 348 256 405 Q142 348 142 275 L142 150 Z" 
        fill="#1a0a2e" fill-opacity="0.6" stroke="url(#neonPink)" stroke-width="2" opacity="0.5"/>
  
  <!-- Circular arrow (restart symbol) -->
  <path d="M256 160 A80 80 0 1 1 196 200" 
        fill="none" stroke="url(#neonPink)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow head -->
  <polygon points="196,180 186,210 210,200" fill="#ff2d95" filter="url(#glow)"/>
  
  <!-- Inner circular arrow (second) -->
  <path d="M256 320 A80 80 0 1 1 316 280" 
        fill="none" stroke="url(#neonPink2)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow head 2 -->
  <polygon points="316,300 326,270 302,280" fill="#ff6ec7" filter="url(#glow)"/>
  
  <!-- Center gear/cog -->
  <circle cx="256" cy="240" r="25" fill="none" stroke="#ff2d95" stroke-width="4" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="12" fill="#ff2d95" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Gear teeth -->
  <rect x="249" y="208" width="14" height="14" rx="2" fill="#ff2d95" filter="url(#glow)"/>
  <rect x="249" y="258" width="14" height="14" rx="2" fill="#ff2d95" filter="url(#glow)"/>
  <rect x="224" y="233" width="14" height="14" rx="2" fill="#ff2d95" filter="url(#glow)"/>
  <rect x="274" y="233" width="14" height="14" rx="2" fill="#ff2d95" filter="url(#glow)"/>
  
  <!-- Diagonal gear teeth -->
  <rect x="232" y="215" width="12" height="12" rx="2" fill="#ff2d95" transform="rotate(45 238 221)" filter="url(#glow)"/>
  <rect x="268" y="253" width="12" height="12" rx="2" fill="#ff2d95" transform="rotate(45 274 259)" filter="url(#glow)"/>
  <rect x="268" y="215" width="12" height="12" rx="2" fill="#ff2d95" transform="rotate(45 274 221)" filter="url(#glow)"/>
  <rect x="232" y="253" width="12" height="12" rx="2" fill="#ff2d95" transform="rotate(45 238 259)" filter="url(#glow)"/>
  
  <!-- "FC" text -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ff2d95" filter="url(#glow)" letter-spacing="8">FAZCODE</text>
  
  <!-- Pulse dots -->
  <circle cx="160" cy="350" r="4" fill="#ff6ec7" opacity="0.6" filter="url(#glow)"/>
  <circle cx="352" cy="350" r="4" fill="#ff6ec7" opacity="0.6" filter="url(#glow)"/>
  <circle cx="180" cy="130" r="3" fill="#ff2d95" opacity="0.4" filter="url(#glow)"/>
  <circle cx="332" cy="130" r="3" fill="#ff2d95" opacity="0.4" filter="url(#glow)"/>
</svg>
